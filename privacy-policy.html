<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Privacy Policy | Eat Well Live Well</title>
<meta name="theme-color" content="#f7f4ef"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Manrope:wght@400;500;600;700;800&family=Sacramento&display=swap" rel="stylesheet"/>
<style>
:root {
  --ink:#21332b;
  --deep:#172821;
  --green:#2f6f5d;
  --green2:#4d8d78;
  --mint:#dfece6;
  --cream:#f8f5ef;
  --paper:#fffdf9;
  --rose:#c96f86;
  --rose-soft:#f7e7eb;
  --muted:#68756f;
  --line:#dddcd5;
  --shadow:0 20px 60px rgba(29,53,43,.10);
  --serif:"Cormorant Garamond", Georgia, serif;
  --sans:"Manrope", Arial, sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.7}
a{color:inherit}
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(248,245,239,.92);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(33,51,43,.08);
}
.header-inner{
  width:min(1180px,calc(100% - 48px));margin:auto;min-height:82px;
  display:flex;align-items:center;justify-content:space-between;gap:28px
}
.wordmark{display:flex;align-items:baseline;gap:7px;text-decoration:none;color:var(--deep);font-family:var(--serif);font-size:30px;font-weight:700;white-space:nowrap}
.wordmark .script{font-family:"Sacramento",cursive;color:var(--rose);font-size:34px;font-weight:400;margin:0 -2px}
.nav{display:flex;align-items:center;gap:28px}
.nav a{text-decoration:none;color:#52615a;font-size:13px;font-weight:700}
.nav a:hover{color:var(--green)}
.home-btn{padding:11px 17px;border:1px solid #cdd7d1;border-radius:999px;text-decoration:none;color:var(--green);font-weight:800;font-size:13px;background:#fff}
.hero{
  position:relative;overflow:hidden;
  padding:84px 0 76px;
  background:
    radial-gradient(circle at 86% 18%, rgba(201,111,134,.15), transparent 28%),
    radial-gradient(circle at 12% 75%, rgba(77,141,120,.17), transparent 30%),
    linear-gradient(135deg,#eef5f1 0%,#faf6f1 58%,#f9eef1 100%);
  border-bottom:1px solid rgba(33,51,43,.08)
}
.hero-inner{width:min(1050px,calc(100% - 48px));margin:auto}
.kicker{margin:0 0 14px;color:var(--green);font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.hero h1{margin:0;font-family:var(--serif);font-size:clamp(54px,7vw,82px);line-height:.96;font-weight:600;letter-spacing:-.025em;color:var(--deep)}
.hero h1 em{color:var(--rose);font-weight:600}
.hero-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px;color:#65736d;font-size:13px}
.hero-meta span{padding:8px 12px;border:1px solid rgba(47,111,93,.15);border-radius:999px;background:rgba(255,255,255,.55)}
.shell{width:min(1180px,calc(100% - 48px));margin:58px auto 92px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:46px;align-items:start}
.toc{position:sticky;top:112px}
.toc-card{padding:26px 22px;border:1px solid var(--line);border-radius:22px;background:rgba(255,253,249,.75);box-shadow:0 10px 35px rgba(29,53,43,.05)}
.toc-title{margin:0 0 16px;font-family:var(--serif);font-size:26px;font-weight:600}
.toc-links{display:flex;flex-direction:column;gap:3px;max-height:62vh;overflow:auto;padding-right:4px}
.toc-links a{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:8px 8px;border-radius:10px;text-decoration:none;color:#64716c;font-size:11px;line-height:1.45}
.toc-links a span{color:var(--rose);font-weight:800}
.toc-links a:hover{background:#edf4f0;color:var(--deep)}
.help-card{margin-top:18px;padding:20px;border-radius:18px;background:var(--deep);color:white}
.help-card small{display:block;color:#b9c9c2;text-transform:uppercase;letter-spacing:.12em;font-weight:800}
.help-card strong{display:block;margin:6px 0 5px;font-family:var(--serif);font-size:22px}
.help-card a{color:#f2b6c4;font-size:12px}
.document-card{background:var(--paper);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:64px 70px}
.legal-copy>p:first-of-type{font-family:var(--serif);font-size:24px;line-height:1.45;color:#405149;margin-top:0}
.legal-copy h2{scroll-margin-top:110px;margin:58px 0 18px;padding-top:3px;font-family:var(--serif);font-size:36px;line-height:1.1;font-weight:600;color:var(--deep);letter-spacing:-.01em}
.legal-copy h2::before{content:"";display:block;width:44px;height:3px;margin-bottom:18px;border-radius:99px;background:linear-gradient(90deg,var(--green2),var(--rose))}
.legal-copy h3{margin:30px 0 10px;font-size:16px;line-height:1.35;color:var(--green);font-weight:800}
.legal-copy p,.legal-copy li{font-size:14.5px;color:#53615b;line-height:1.85}
.legal-copy p{margin:0 0 15px}
.legal-copy ul{margin:12px 0 20px;padding-left:22px}
.legal-copy li{padding-left:5px;margin:7px 0}
.legal-copy strong{color:var(--deep)}
.legal-copy a{color:var(--green);font-weight:700}
.footer{background:var(--deep);color:#c9d2ce;padding:42px 0}
.footer-inner{width:min(1180px,calc(100% - 48px));margin:auto;display:flex;justify-content:space-between;align-items:center;gap:30px;font-size:12px}
.footer a{color:#e7b0bd;text-decoration:none}
.footer-links{display:flex;gap:18px;flex-wrap:wrap}
@media(max-width:900px){
  .nav{display:none}
  .shell{grid-template-columns:1fr}
  .toc{position:static}
  .toc-card{display:none}
  .help-card{margin-top:0}
  .document-card{padding:44px 34px}
}
@media(max-width:600px){
  .header-inner,.hero-inner,.shell,.footer-inner{width:min(100% - 30px,1180px)}
  .header-inner{min-height:70px}
  .wordmark{font-size:24px;gap:5px}
  .wordmark .script{font-size:29px}
  .home-btn{font-size:11px;padding:9px 12px}
  .hero{padding:58px 0 50px}
  .hero h1{font-size:52px}
  .shell{margin:30px auto 58px}
  .document-card{padding:34px 22px;border-radius:20px}
  .legal-copy>p:first-of-type{font-size:21px}
  .legal-copy h2{font-size:31px;margin-top:48px}
  .footer-inner{align-items:flex-start;flex-direction:column}
}
</style>
</head>

</html>
