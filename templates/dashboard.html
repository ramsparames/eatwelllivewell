<!DOCTYPE html>
<html>

<head>
    <title>Coach Dashboard</title>
</head>

<body>

<h1>Eat Well Live Well</h1>

<h2>Coach Dashboard</h2>

<table border="1" cellpadding="8">

<tr>
    <th>Name</th>
    <th>Email</th>
    <th>Score</th>
    <th>Opportunity</th>
    <th>Date</th>
</tr>

{% for lead in leads %}

<tr>
    <td>{{ lead.name }}</td>
    <td>{{ lead.email }}</td>
    <td>{{ lead.total_score }}</td>
    <td>{{ lead.opportunity }}</td>
    <td>{{ lead.submitted_at }}</td>
</tr>

{% endfor %}

</table>

</body>

</html>
