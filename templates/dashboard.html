<!DOCTYPE html>
<html>

<head>

    <title>Coach Dashboard</title>

    <link rel="stylesheet"
          href="/static/dashboard.css">
</head>

<body>

<h1>Eat Well Live Well</h1>

<h2>Coach Dashboard</h2>

<table border="1" cellpadding="8">

<tr>
    <th>Name</th>
    <th>Email</th>
    <th>Score</th>
    <th>Opportunity</th>
    <th>Date</th>
</tr>

{% for lead in leads %}

<tr>
    <<td>
    <a href="/dashboard/leads/{{ lead.id }}">
        {{ lead.name }}
    </a>
    </td>
    <td>{{ lead.email }}</td>
    <td>{{ lead.total_score }}</td>
    <td>{{ lead.opportunity }}</td>
    <td>{{ lead.submitted_at }}</td>
</tr>

{% endfor %}

</table>

</body>

</html>
