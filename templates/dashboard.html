<!DOCTYPE html>
<html>

<head>

    <title>Coach Dashboard</title>

    <link rel="stylesheet"
          href="/static/dashboard.css">

</head>

<body>

<div class="container">

<h1>Eat Well Live Well</h1>

<h2>Coach Dashboard</h2>

<div class="summary-card">

    <div>

        <span class="label">

            Total Leads

        </span>

        <div class="number">

            {{ leads|length }}

        </div>

    </div>

</div>

{% for lead in leads %}

<a class="card"
   href="/dashboard/leads/{{ lead.id }}">

    <div class="top">

        <div>

            <h3>{{ lead.name }}</h3>

            <p>{{ lead.email }}</p>

        </div>

        <div class="score">

            {{ lead.total_score }}

        </div>

    </div>

    <div class="bottom">

        <span>

            Opportunity:
            {{ lead.opportunity }}

        </span>

        <span>

            {{ lead.submitted_at }}

        </span>

    </div>

</a>

{% endfor %}

</div>

</body>

</html>
