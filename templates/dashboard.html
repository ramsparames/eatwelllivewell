<!DOCTYPE html>
<html>

<head>

    <title>Coach Dashboard</title>

    <link rel="stylesheet"
          href="/static/dashboard.css">

</head>

<body>

<div class="container">

<h1>Eat Well Live Well</h1>

<h2>Coach Dashboard</h2>

<div class="summary-card">

    <div>

        <span class="label">

            Total Leads

        </span>

        <div class="number">

            {{ leads|length }}

        </div>

    </div>

</div>

{% for lead in leads %}

<a class="card"
   href="/dashboard/leads/{{ lead.id }}">

    <div class="top">

        <div>

            <h3>{{ lead.name }}</h3>

            <p>{{ lead.phone }}</p>

        </div>

       <div class="
        score

        {% if lead.total_score < 40 %}

            danger

        {% elif lead.total_score < 60 %}

            warning

        {% else %}

            success

        {% endif %}
        ">

        {{ lead.total_score }}

        </div>

    </div>

    <div class="bottom">

    <div>

        <strong>Opportunity</strong>

        <br>

        {{ lead.opportunity }}

    </div>

    <div>

        <strong>Strength</strong>

        <br>

        {{ lead.strength }}

    </div>

    <div>

        {{ lead.submitted_at }}

    </div>

</div>

</a>

{% endfor %}

</div>

</body>

</html>
