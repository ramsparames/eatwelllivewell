<!DOCTYPE html>
<html>
<head>
    <title>{{ client.name }} | NourisHer</title>
    <link rel="stylesheet" href="/static/dashboard.css">
</head>

<body class="dashboard-page">

<main class="dashboard-shell">

    <a href="/dashboard/clients">
        ← Back to Clients
    </a>

    <section class="dashboard-panel">

        <p class="eyebrow">
            Client profile
        </p>

        <h1>
            {{ client.name }}
        </h1>

        <p>
            {{ client.program }}
            ·
            {{ client.status|title }}
        </p>

        <div class="detail-grid">

            <article class="detail-card">
                <span class="detail-label">
                    Email
                </span>
                <h3>
                    {{ client.email or "Not added" }}
                </h3>
            </article>

            <article class="detail-card">
                <span class="detail-label">
                    Phone
                </span>
                <h3>
                    {{ client.phone or "Not added" }}
                </h3>
            </article>

            <article class="detail-card">
                <span class="detail-label">
                    Program
                </span>
                <h3>
                    {{ client.program }}
                </h3>
            </article>

            <article class="detail-card">
                <span class="detail-label">
                    Status
                </span>
                <h3>
                    {{ client.status|title }}
                </h3>
            </article>

        </div>

    </section>

</main>

</body>
</html>
