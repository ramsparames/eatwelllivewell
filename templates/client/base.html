<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}NourisHer Client Portal | Eat Well Live Well{% endblock %}</title>
    <style>
        :root{
            --ew-purple:#5b0e91;
            --ew-purple-dark:#43066d;
            --ew-ink:#28232c;
            --ew-muted:#756f79;
            --ew-line:#e6dee9;
            --ew-bg:#f8f5f9;
            --ew-white:#fff;
        }
        *{box-sizing:border-box}
        html{font-size:16px}
        body{
            margin:0;
            background:var(--ew-bg);
            color:var(--ew-ink);
            font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
            line-height:1.5;
        }
        .client-site-header{
            border-bottom:1px solid var(--ew-line);
            background:rgba(255,255,255,.96);
        }
        .client-site-header-inner{
            width:min(1180px,calc(100% - 34px));
            min-height:68px;
            margin:0 auto;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:20px;
        }
        .client-brand{
            display:flex;
            align-items:center;
            gap:14px;
            min-width:0;
            text-decoration:none;
            color:inherit;
        }
        .client-brand img{
            width:175px;
            height:44px;
            object-fit:contain;
            object-position:left center;
        }
        .client-brand-copy{
            padding-left:13px;
            border-left:1px solid var(--ew-line);
        }
        .client-brand-copy strong{
            display:block;
            font-size:14px;
            letter-spacing:-.01em;
        }
        .client-brand-copy span{
            display:block;
            margin-top:1px;
            color:var(--ew-muted);
            font-size:10px;
        }
        .client-private{
            color:var(--ew-muted);
            font-size:11px;
            font-weight:700;
        }
        .client-app-shell{min-height:calc(100vh - 140px)}
        .client-site-footer{
            margin-top:26px;
            border-top:1px solid var(--ew-line);
            background:#fff;
        }
        .client-site-footer-inner{
            width:min(1180px,calc(100% - 34px));
            margin:0 auto;
            padding:19px 0;
            display:flex;
            justify-content:space-between;
            gap:18px;
            color:var(--ew-muted);
            font-size:11px;
        }
        .client-site-footer strong{color:var(--ew-ink)}
        @media(max-width:620px){
            .client-site-header-inner{width:calc(100% - 24px);min-height:60px}
            .client-brand img{width:145px;height:38px}
            .client-brand-copy{display:none}
            .client-private{font-size:10px}
            .client-site-footer-inner{width:calc(100% - 24px);display:block}
            .client-site-footer-inner span{display:block;margin-top:3px}
        }
    </style>
</head>
<body>
<header class="client-site-header">
    <div class="client-site-header-inner">
        <div class="client-brand">
            <img src="/static/eatwelllivewell-logo.png" alt="Eat Well Live Well">
            <div class="client-brand-copy">
                <strong>NourisHer Client Portal</strong>
                <span>Your coaching check-in space</span>
            </div>
        </div>
        <div class="client-private">Private coaching portal</div>
    </div>
</header>

<main class="client-app-shell">
    {% block content %}{% endblock %}
</main>

<footer class="client-site-footer">
    <div class="client-site-footer-inner">
        <div><strong>Eat Well Live Well</strong> · NourisHer</div>
        <span>Small consistent actions. One day at a time.</span>
    </div>
</footer>
</body>
</html>
